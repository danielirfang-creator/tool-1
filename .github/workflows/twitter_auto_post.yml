name: Twitter / X Cloud Auto-Poster

on:
  schedule:
    # Runs every 4 hours automatically in the cloud 24/7
    - cron: '30 */4 * * *'
  workflow_dispatch: # Allows manual 1-click run anytime from GitHub

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Chromium
        run: |
          pip install playwright requests pillow
          python -m playwright install --with-deps chromium

      - name: Post Next Tweet to Twitter / X
        run: |
          python scripts/twitter_auto_bot.py post_one --headless

      - name: Commit & Push Updated History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add twitter_bot/posted_history.json twitter_bot/storage_state.json || true
          [ -f twitter_bot/last_error.png ] && git add twitter_bot/last_error.png || true
          git diff --staged --quiet || (git pull --rebase origin main && git commit -m "Auto-posted scheduled Twitter tip [skip ci]" && git push)
