name: Daily Watchdog & ntfy Reporter

on:
  schedule:
    # 18:59 UTC is approx 11:59 PM PKT (Pakistan Time UTC+5)
    - cron: '59 18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Send Daily Summary to Mobile (ntfy)
        run: |
          python scripts/daily_watchdog_reporter.py --scheduled

      - name: Commit & Push HTML Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_REPORT.html
          git diff --staged --quiet || (git commit -m "Update daily report HTML [skip ci]" && git push)
