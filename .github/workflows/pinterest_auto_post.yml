name: Pinterest Cloud Auto-Poster

on:
  schedule:
    # Runs every 4 hours automatically in the cloud 24/7
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual 1-click run anytime from GitHub

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Chromium
        run: |
          pip install playwright requests pillow
          python -m playwright install --with-deps chromium

      - name: Update Pinterest Profile Branding
        continue-on-error: true
        run: |
          python scripts/update_pinterest_profile.py

      - name: Post Next Pinterest Pin
        run: |
          python scripts/pinterest_auto_bot.py post_one --headless

      - name: Commit & Push Updated History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pinterest_bot/posted_history.json pinterest_bot/live_profile_updated.png pinterest_bot/storage_state.json || true
          [ -f pinterest_bot/last_publish_result.png ] && git add pinterest_bot/last_publish_result.png || true
          git diff --staged --quiet || git commit -m "Auto-posted scheduled Pinterest pin and updated profile [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
