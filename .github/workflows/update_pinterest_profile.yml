name: Update Pinterest Profile

on:
  workflow_dispatch: # Trigger manually from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Chromium
        run: |
          pip install playwright requests pillow
          python -m playwright install --with-deps chromium

      - name: Update Pinterest Profile
        run: |
          python scripts/update_pinterest_profile.py

      - name: Commit & Push Updated Profile Screenshots & Session
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pinterest_bot/live_profile_updated.png pinterest_bot/storage_state.json
          git diff --staged --quiet || (git commit -m "Update Pinterest profile branding & screenshots [skip ci]" && git push)
